<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的數位圖書館</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 閱讀器主題樣式定義 */
        body.theme-amber { background-color: #fdfbf7; color: #433422; }
        body.theme-amber #readerView { background-color: #fdfbf7; color: #433422; }
        body.theme-amber header { background-color: rgba(255, 255, 255, 0.9); border-color: #f1ebd9; }
        body.theme-amber .badge { background-color: #f3edd9; color: #785a28; }

        body.theme-white { background-color: #ffffff; color: #1e293b; }
        body.theme-white #readerView { background-color: #ffffff; color: #1e293b; }
        body.theme-white header { background-color: rgba(255, 255, 255, 0.95); border-color: #e2e8f0; }
        body.theme-white .badge { background-color: #f1f5f9; color: #475569; }

        body.theme-green { background-color: #f0f7f4; color: #1b382b; }
        body.theme-green #readerView { background-color: #f0f7f4; color: #1b382b; }
        body.theme-green header { background-color: rgba(235, 247, 242, 0.9); border-color: #d1e7de; }
        body.theme-green .badge { background-color: #d8ede3; color: #235c43; }

        body.theme-dark { background-color: #0f172a; color: #cbd5e1; }
        body.theme-dark #readerView { background-color: #0f172a; color: #cbd5e1; }
        body.theme-dark header { background-color: rgba(30, 41, 59, 0.9); border-color: #334155; }
        body.theme-dark .badge { background-color: #1e293b; color: #94a3b8; }

        /* 字體大小級距 */
        .font-size-sm { font-size: 0.875rem; line-height: 1.5rem; }
        .font-size-md { font-size: 1rem; line-height: 1.75rem; }
        .font-size-lg { font-size: 1.125rem; line-height: 2rem; }
        .font-size-xl { font-size: 1.25rem; line-height: 2.25rem; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col theme-amber">

    <!-- ==================== 書架首頁視圖 ==================== -->
    <div id="homeView" class="flex flex-col min-h-screen">
        <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-20">
            <div class="flex items-center justify-between px-4 py-3">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-book-bookmark text-xl"></i>
                    <h1 class="text-lg font-bold tracking-wide">數位圖書館</h1>
                </div>
                <button onclick="openFolderModal()" class="bg-indigo-700 hover:bg-indigo-800 text-xs px-3 py-1.5 rounded-lg flex items-center space-x-1 transition">
                    <i class="fa-solid fa-folder-plus"></i>
                    <span>新增資料夾</span>
                </button>
            </div>
            <div class="px-4 pb-3">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </span>
                    <input type="text" id="searchInput" oninput="handleSearch(this.value)" placeholder="搜尋書名、內文或分類..." 
                        class="w-full pl-10 pr-4 py-2 bg-indigo-500/30 text-white placeholder-indigo-200 text-sm rounded-xl focus:outline-none focus:bg-indigo-700 transition">
                </div>
            </div>
        </header>

        <main class="flex-1 max-w-lg w-full mx-auto p-4 pb-24">
            <div class="flex space-x-2 overflow-x-auto pb-3 mb-2 no-scrollbar" id="folderChipsContainer"></div>
            <div id="notesContainer" class="space-y-3"></div>
            <div id="emptyState" class="hidden text-center py-12">
                <i class="fa-solid fa-books text-4xl text-slate-300 mb-3"></i>
                <p class="text-slate-500 text-sm">目前沒有找到相關藏書</p>
            </div>
        </main>

        <div class="fixed bottom-6 right-6 z-30">
            <button onclick="openNoteModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white w-14 h-14 rounded-full shadow-lg flex items-center justify-center text-xl transition transform active:scale-95">
                <i class="fa-solid fa-plus"></i>
            </button>
        </div>

        <footer class="bg-white border-t border-slate-200 py-3 text-center text-xs text-slate-400 fixed bottom-0 w-full z-10">
            已收錄 <span id="totalNotesCount">0</span> 本藏書 · 共 <span id="totalFoldersCount">0</span> 個分類
        </footer>
    </div>


    <!-- ==================== 小說內文閱讀頁面 (跳轉視圖) ==================== -->
    <div id="readerView" class="hidden flex-col min-h-screen absolute inset-0 z-40">
        <header class="backdrop-blur-md border-b sticky top-0 px-4 py-3 flex items-center justify-between shadow-sm">
            <button onclick="backToHome()" class="flex items-center space-x-1.5 font-semibold text-sm transition opacity-80 hover:opacity-100">
                <i class="fa-solid fa-chevron-left"></i>
                <span>返回書架</span>
            </button>
            <div class="flex items-center space-x-3">
                <button onclick="openSettingsModal()" class="p-1.5 transition" title="閱讀設定"><i class="fa-solid fa-sliders text-sm"></i></button>
                <button onclick="editCurrentNote()" class="p-1.5 transition" title="編輯"><i class="fa-solid fa-pen text-sm"></i></button>
                <button onclick="deleteCurrentNote()" class="p-1.5 transition text-red-500" title="刪除"><i class="fa-solid fa-trash text-sm"></i></button>
            </div>
        </header>

        <main class="flex-1 max-w-lg w-full mx-auto p-6 overflow-y-auto">
            <div class="mb-4">
                <span id="readerFolder" class="text-xs px-2.5 py-1 rounded-md font-semibold inline-block mb-2 badge"></span>
                <h1 id="readerTitle" class="text-2xl font-bold leading-snug"></h1>
                <div id="readerDate" class="text-xs opacity-60 mt-2"></div>
            </div>
            <hr class="my-4 opacity-20 border-current">
            <div id="readerContent" class="whitespace-pre-wrap font-serif font-size-md">
                <!-- 內文呈現 -->
            </div>
        </main>
    </div>


    <!-- ==================== 彈出視窗：閱讀設定 ==================== -->
    <div id="settingsModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white text-slate-800 w-full max-w-sm rounded-2xl p-5 shadow-2xl space-y-5">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="text-lg font-bold flex items-center space-x-2">
                    <i class="fa-solid fa-gear text-indigo-600"></i>
                    <span>閱讀介面設定</span>
                </h3>
                <button onclick="closeSettingsModal()" class="text-slate-400 hover:text-slate-600 p-2"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-2">背景主題</label>
                <div class="grid grid-cols-4 gap-2">
                    <button onclick="setTheme('amber')" class="p-3 rounded-xl border-2 border-amber-200 bg-amber-50 text-xs font-medium text-amber-900 flex flex-col items-center justify-center space-y-1">
                        <i class="fa-solid fa-book-open"></i><span>護眼米</span>
                    </button>
                    <button onclick="setTheme('white')" class="p-3 rounded-xl border-2 border-slate-200 bg-white text-xs font-medium text-slate-700 flex flex-col items-center justify-center space-y-1">
                        <i class="fa-solid fa-file"></i><span>純白</span>
                    </button>
                    <button onclick="setTheme('green')" class="p-3 rounded-xl border-2 border-emerald-200 bg-emerald-50 text-xs font-medium text-emerald-900 flex flex-col items-center justify-center space-y-1">
                        <i class="fa-solid fa-leaf"></i><span>墨綠</span>
                    </button>
                    <button onclick="setTheme('dark')" class="p-3 rounded-xl border-2 border-slate-700 bg-slate-900 text-xs font-medium text-slate-200 flex flex-col items-center justify-center space-y-1">
                        <i class="fa-solid fa-moon"></i><span>夜間</span>
                    </button>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-2">字體大小</label>
                <div class="grid grid-cols-4 gap-2">
                    <button onclick="setFontSize('sm')" class="py-2 rounded-xl border border-slate-200 text-xs font-medium hover:bg-slate-100">小</button>
                    <button onclick="setFontSize('md')" class="py-2 rounded-xl border border-indigo-600 bg-indigo-50 text-indigo-700 text-sm font-semibold">標準</button>
                    <button onclick="setFontSize('lg')" class="py-2 rounded-xl border border-slate-200 text-base font-medium hover:bg-slate-100">大</button>
                    <button onclick="setFontSize('xl')" class="py-2 rounded-xl border border-slate-200 text-lg font-medium hover:bg-slate-100">特大</button>
                </div>
            </div>

            <button onclick="closeSettingsModal()" class="w-full bg-indigo-600 text-white py-2.5 rounded-xl text-sm font-semibold transition hover:bg-indigo-700">完成設定</button>
        </div>
    </div>


    <!-- ==================== 彈出視窗：新增/編輯藏書 ==================== -->
    <div id="noteModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-white w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl p-5 max-h-[90vh] overflow-y-auto shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 id="noteModalTitle" class="text-lg font-bold text-slate-800">新增藏書</h3>
                <button onclick="closeNoteModal()" class="text-slate-400 hover:text-slate-600 p-2"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <input type="hidden" id="noteId">
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">書名 / 標題</label>
                    <input type="text" id="noteTitleInput" placeholder="請輸入書名..." class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500 text-slate-800">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">資料夾分類</label>
                    <select id="noteFolderSelect" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500 bg-white text-slate-800"></select>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">內文 / 章節內容</label>
                    <textarea id="noteContentInput" rows="7" placeholder="在此輸入小說或文章內文..." class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500 resize-none text-slate-800"></textarea>
                </div>
                <div class="flex space-x-3 pt-2">
                    <button onclick="closeNoteModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 py-2.5 rounded-xl text-sm font-semibold transition">取消</button>
                    <button onclick="saveNote()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl text-sm font-semibold transition">儲存</button>
                </div>
            </div>
        </div>
    </div>


    <!-- ==================== 彈出視窗：新增資料夾 ==================== -->
    <div id="folderModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-slate-800">新增資料夾分類</h3>
                <button onclick="closeFolderModal()" class="text-slate-400 hover:text-slate-600 p-2"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="space-y-4">
                <input type="text" id="folderNameInput" placeholder="例如：科幻小說、歷史傳記..." class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500 text-slate-800">
                <div class="flex space-x-3">
                    <button onclick="closeFolderModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 py-2 rounded-xl text-sm font-semibold transition">取消</button>
                    <button onclick="saveFolder()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-xl text-sm font-semibold transition">建立</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 訊息對話框 -->
    <div id="customModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-xs rounded-2xl p-5 text-center shadow-xl">
            <p id="customModalMessage" class="text-slate-700 text-sm mb-4">提示訊息</p>
            <button onclick="closeCustomModal()" class="bg-indigo-600 text-white px-4 py-2 rounded-xl text-xs font-semibold w-full">確定</button>
        </div>
    </div>

    <script>
        // 註冊 Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // 注意：因為你的專案在 /Reader/ 底下，路徑要寫對
          navigator.serviceWorker.register('/Reader/sw.js')
            .then(reg => console.log('Service Worker 註冊成功：', reg.scope))
            .catch(err => console.log('Service Worker 註冊失敗：', err));
        });
      }
        let folders = JSON.parse(localStorage.getItem('lib_folders')) || ['全部藏書', '預設小說'];
        let notes = JSON.parse(localStorage.getItem('lib_notes')) || [
            { id: 1, title: '第一章：起點', folder: '預設小說', content: '這是第一章的內容。\n\n主角站在圖書館的門口，微風輕輕吹拂。這是一個充滿未知的世界...', date: '2026-06-01' }
        ];
        let currentFolder = '全部藏書';
        let searchQuery = '';
        let currentReadingId = null;

        let currentTheme = localStorage.getItem('lib_theme') || 'amber';
        let currentFontSize = localStorage.getItem('lib_fontsize') || 'md';

        function saveData() {
            localStorage.setItem('lib_folders', JSON.stringify(folders));
            localStorage.setItem('lib_notes', JSON.stringify(notes));
            localStorage.setItem('lib_theme', currentTheme);
            localStorage.setItem('lib_fontsize', currentFontSize);
        }

        function showToast(msg) {
            document.getElementById('customModalMessage').innerText = msg;
            document.getElementById('customModal').classList.remove('hidden');
        }

        function closeCustomModal() {
            document.getElementById('customModal').classList.add('hidden');
        }

        window.onload = function() {
            renderFolders();
            renderNotes();
            applyTheme(currentTheme);
            applyFontSize(currentFontSize);
        }

        function renderFolders() {
            const container = document.getElementById('folderChipsContainer');
            container.innerHTML = '';
            
            folders.forEach(folder => {
                const isSelected = currentFolder === folder;
                const btn = document.createElement('button');
                btn.className = `px-3.5 py-1.5 rounded-full text-xs font-medium whitespace-nowrap transition flex items-center space-x-1.5 ${
                    isSelected ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-100'
                }`;
                btn.innerHTML = `<i class="fa-solid fa-folder text-[10px]"></i><span>${folder}</span>`;
                btn.onclick = () => {
                    currentFolder = folder;
                    renderFolders();
                    renderNotes();
                };
                container.appendChild(btn);
            });

            document.getElementById('totalFoldersCount').innerText = folders.length - 1;
        }

        function renderNotes() {
            const container = document.getElementById('notesContainer');
            const emptyState = document.getElementById('emptyState');
            container.innerHTML = '';

            let filtered = notes.filter(note => {
                const matchFolder = (currentFolder === '全部藏書' || note.folder === currentFolder);
                const matchSearch = searchQuery === '' || 
                    note.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                    note.content.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    note.folder.toLowerCase().includes(searchQuery.toLowerCase());
                return matchFolder && matchSearch;
            });

            document.getElementById('totalNotesCount').innerText = notes.length;

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

            filtered.forEach(note => {
                const card = document.createElement('div');
                card.className = 'bg-white rounded-2xl p-4 shadow-sm border border-slate-100 hover:shadow-md transition cursor-pointer relative';
                card.onclick = () => openReader(note.id);
                
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-[10px] bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded-md font-semibold">${note.folder}</span>
                        <div class="text-slate-400 text-xs">${note.date}</div>
                    </div>
                    <h3 class="font-bold text-slate-800 text-base mb-1">${escapeHtml(note.title)}</h3>
                    <p class="text-slate-600 text-xs line-clamp-2 whitespace-pre-wrap leading-relaxed">${escapeHtml(note.content)}</p>
                `;
                container.appendChild(card);
            });
        }

        function openReader(id) {
            const note = notes.find(n => n.id === id);
            if (!note) return;
            currentReadingId = id;

            document.getElementById('readerFolder').innerText = note.folder;
            document.getElementById('readerTitle').innerText = note.title;
            document.getElementById('readerContent').innerText = note.content;
            document.getElementById('readerDate').innerText = '收錄日期：' + note.date;

            document.getElementById('homeView').classList.add('hidden');
            const readerView = document.getElementById('readerView');
            readerView.classList.remove('hidden');
            readerView.classList.add('flex');
            window.scrollTo(0, 0);
        }

        function backToHome() {
            const readerView = document.getElementById('readerView');
            readerView.classList.add('hidden');
            readerView.classList.remove('flex');
            document.getElementById('homeView').classList.remove('hidden');
            currentReadingId = null;
            renderNotes();
        }

        function openSettingsModal() {
            document.getElementById('settingsModal').classList.remove('hidden');
        }

        function closeSettingsModal() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        function setTheme(theme) {
            currentTheme = theme;
            applyTheme(theme);
            saveData();
        }

        function applyTheme(theme) {
            // 移除所有舊的主題類別
            document.body.classList.remove('theme-amber', 'theme-white', 'theme-green', 'theme-dark');
            // 加入新的主題類別
            document.body.classList.add(`theme-${theme}`);
        }

            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-2">背景主題</label>
                <div class="grid grid-cols-4 gap-2">
                    <button onclick="setTheme('amber')" class="p-3 rounded-xl border-2 border-amber-200 bg-amber-50 text-xs font-medium text-amber-900 flex flex-col items-center justify-center space-y-1">
                        <i class="fa-solid fa-book-open"></i><span>護眼米</span>
                    </button>
                    <button onclick="setTheme('white')" class="p-3 rounded-xl border-2 border-slate-200 bg-white text-xs font-medium text-slate-700 flex flex-col items-center justify-center space-y-1">

                    </button>

                        <i class="fa-solid fa-leaf"></i><span>墨綠</span>
                    </button>
                    <button onclick="setTheme('dark')" class="p-3 rounded-xl border-2 border-slate-700 bg-slate-900 text-xs font-medium text-slate-200 flex flex-col items-center justify-center space-y-1">
                        <i class="fa-solid fa-moon"></i><span>夜間</span>
                    </button>
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-500 uppercase mb-2">字體大小</label>
                <div class="grid grid-cols-4 gap-2">
                    <button onclick="setFontSize('sm')" class="py-2 rounded-xl border border-slate-200 text-xs font-medium hover:bg-slate-100">小</button>
                    <button onclick="setFontSize('md')" class="py-2 rounded-xl border border-indigo-600 bg-indigo-50 text-indigo-700 text-sm font-semibold">標準</button>

    </div>


    <!-- ==================== 彈出視窗：新增/編輯藏書 ==================== -->

            <div class="flex justify-between items-center mb-4">
                <h3 id="noteModalTitle" class="text-lg font-bold text-slate-800">新增藏書</h3>

                    <input type="text" id="noteTitleInput" placeholder="請輸入書名..." class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500 text-slate-800">
                </div>

                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">內文 / 章節內容</label>
                    <textarea id="noteContentInput" rows="7" placeholder="在此輸入小說或文章內文..." class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:border-indigo-500 resize-none text-slate-800"></textarea>

            document.getElementById('totalFoldersCount').innerText = folders.length - 1;

        function deleteFolder(folderName) {
            if (confirm(`確定要刪除資料夾「${folderName}」嗎？\n該分類底下的所有藏書將自動移至「預設小說」。`)) {
                // 將該分類底下的藏書轉移到「預設小說」

                    if (note.folder === folderName) {
                        note.folder = '預設小說';
                    }
                });

                // 從資料夾陣列中移除
                folders = folders.filter(f => f !== folderName);

                // 如果目前剛好停留在被刪除的資料夾，切回「全部藏書」
                if (currentFolder === folderName) {
                    currentFolder = '全部藏書';
                }

                saveData();
                renderFolders();
                renderNotes();
                showToast(`已成功刪除資料夾「${folderName}」`);
            }

        function renderNotes() {

            let filtered = notes.filter(note => {
                const matchFolder = (currentFolder === '全部藏書' || note.folder === currentFolder);

                    note.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                    note.content.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    note.folder.toLowerCase().includes(searchQuery.toLowerCase());
                return matchFolder && matchSearch;
            });

                `;
                container.appendChild(card);
            });
        }

        function openReader(id) {
            const note = notes.find(n => n.id === id);
            if (!note) return;
            currentReadingId = id;

            document.getElementById('readerFolder').innerText = note.folder;
            document.getElementById('readerTitle').innerText = note.title;
            document.getElementById('readerContent').innerText = note.content;
            document.getElementById('readerDate').innerText = '收錄日期：' + note.date;

            document.getElementById('homeView').classList.add('hidden');
            const readerView = document.getElementById('readerView');
            readerView.classList.remove('hidden');
            readerView.classList.add('flex');
            window.scrollTo(0, 0);
        }

        function backToHome() {
            const readerView = document.getElementById('readerView');
            readerView.classList.add('hidden');
            readerView.classList.remove('flex');
            document.getElementById('homeView').classList.remove('hidden');
            currentReadingId = null;
            renderNotes();
        }

        function openSettingsModal() {
            document.getElementById('settingsModal').classList.remove('hidden');
        }

        function closeSettingsModal() {
            document.getElementById('settingsModal').classList.add('hidden');
        }

        function setTheme(theme) {
            currentTheme = theme;
            applyTheme(theme);
            saveData();
        }

        function applyTheme(theme) {
            // 移除所有舊的主題類別
            document.body.classList.remove('theme-amber', 'theme-white', 'theme-green', 'theme-dark');
            // 加入新的主題類別
            document.body.classList.add(`theme-${theme}`);
        }

        function setFontSize(size) {
            currentFontSize = size;
            applyFontSize(size);
            saveData();
        }

        function applyFontSize(size) {
            const readerContent = document.getElementById('readerContent');
            readerContent.classList.remove('font-size-sm', 'font-size-md', 'font-size-lg', 'font-size-xl');
            readerContent.classList.add(`font-size-${size}`);
        }

        function editCurrentNote() {
            const id = currentReadingId;
            backToHome();
            openNoteModal(id);
        }

        function deleteCurrentNote() {
            if (confirm('確定要刪除這本書嗎？')) {
                notes = notes.filter(n => n.id !== currentReadingId);
                saveData();
                backToHome();
            }
        }

        function handleSearch(val) {
            searchQuery = val.trim();
            renderNotes();
        }

        function openNoteModal(id = null) {
            const select = document.getElementById('noteFolderSelect');
            select.innerHTML = '';
            folders.filter(f => f !== '全部藏書').forEach(f => {
                const opt = document.createElement('option');
                opt.value = f;
                opt.innerText = f;
                select.appendChild(opt);
            });

            if (id) {
                const note = notes.find(n => n.id === id);
                if (note) {
                    document.getElementById('noteModalTitle').innerText = '編輯藏書';
                    document.getElementById('noteId').value = note.id;
                    document.getElementById('noteTitleInput').value = note.title;
                    document.getElementById('noteFolderSelect').value = note.folder;
                    document.getElementById('noteContentInput').value = note.content;
                }
            } else {
                document.getElementById('noteModalTitle').innerText = '新增藏書';
                document.getElementById('noteId').value = '';
                document.getElementById('noteTitleInput').value = '';
                document.getElementById('noteContentInput').value = '';
                if(currentFolder !== '全部藏書') {
                    document.getElementById('noteFolderSelect').value = currentFolder;
                }
            }
            document.getElementById('noteModal').classList.remove('hidden');
        }

        function closeNoteModal() {
            document.getElementById('noteModal').classList.add('hidden');
        }

        function saveNote() {
            const id = document.getElementById('noteId').value;
            const title = document.getElementById('noteTitleInput').value.trim();
            const folder = document.getElementById('noteFolderSelect').value;
            const content = document.getElementById('noteContentInput').value.trim();

            if (!title) {
                showToast('請輸入書名或標題');
                return;
            }

            const today = new Date().toISOString().split('T')[0];

            if (id) {
                const note = notes.find(n => n.id == id);
                if (note) {
                    note.title = title;
                    note.folder = folder;
                    note.content = content;
                    note.date = today;
                }
            } else {
                const newNote = {
                    id: Date.now(),
                    title,
                    folder,
                    content,
                    date: today
                };
                notes.push(newNote);
            }

            saveData();
            closeNoteModal();
            renderNotes();
        }

        function openFolderModal() {
            document.getElementById('folderNameInput').value = '';
            document.getElementById('folderModal').classList.remove('hidden');
        }

        function closeFolderModal() {
            document.getElementById('folderModal').classList.add('hidden');
        }

        function saveFolder() {
            const name = document.getElementById('folderNameInput').value.trim();
            if (!name) {
                showToast('請輸入資料夾名稱');
                return;
            }
            if (folders.includes(name)) {
                showToast('資料夾名稱已存在');
                return;
            }

            folders.push(name);
            saveData();
            closeFolderModal();
            renderFolders();
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
